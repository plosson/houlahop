name: Deploy Site (siteio)

on:
  push:
    branches: [main]
    paths:
      - 'site/src/**'
      - 'scripts/build.ts'
      - 'package.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy to houlahop.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Install siteio
        run: |
          curl -LsSf https://siteio.houlahop.com/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Login
        run: siteio login --username github-actions
        env:
          SITEIO_TOKEN: ${{ secrets.SITEIO_TOKEN }}
      - run: siteio sites deploy site/dist -n www
      - run: sh scripts/smoke.sh
